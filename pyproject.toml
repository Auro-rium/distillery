[project]
name = "distillery"
version = "0.0.0"
description = "Sandbox-verified distillation autopilot on Nebius Token Factory"
requires-python = ">=3.12"
license = { text = "MIT" }
# Runtime dependencies are added only after the Phase 0 spikes confirm the
# real SDK/API shapes (see docs/NEBIUS_NOTES.md).
dependencies = ["pydantic>=2.7", "openai>=1.50", "contree-sdk>=0.3.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "BLE"]  # BLE: no blind `except Exception`

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/distillery"]
